version: 1
layout: repo
lastReviewedAt: "2026-11-02"
lastReviewedCommit: "f124e98fcfc9ec44e0c5a6d40e39ed90d6c57c6b"
reviewNote: "Docs #228: reviewed the nine-package cohort, scoped fixed RE2JS/KaTeX graph and real consumer contracts; existing Node/pnpm/TypeScript pins, strict policy, four-locale static/search/SEO and publication boundaries remain. Frozen install, parser comparison, consumer/toolchain, audit, lint and typecheck evidence is local; full build and hosted/deployment qualification remain separate."
lastReviewedNote: "Docs #228: reviewed the nine-package cohort, scoped fixed RE2JS/KaTeX graph and real consumer contracts; existing Node/pnpm/TypeScript pins, strict policy, four-locale static/search/SEO and publication boundaries remain. Frozen install, parser comparison, consumer/toolchain, audit, lint and typecheck evidence is local; full build and hosted/deployment qualification remain separate."

catalog:
  repos:
    - id: next-docs
      path: .
      canonicalRepo: tiangong-lca/docs
      entryDoc: AGENTS.md
      workflowDocs:
        - docs/agents/repo-validation.md
        - docs/agents/repo-architecture.md
        - docs/agents/dependency-updates.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - TODO.docs-system-gaps.md
          - .docpact/config.yaml
          - docs/agents/**
          - .github/dependabot.yml
          - .github/workflows/**
      ownerRepo: next-docs
    - id: public-doc-content
      paths:
        include:
          - content/docs/**
          - public/assets/docs/**
          - public/favicon.ico
          - public/logo-light.svg
          - public/logo-dark.svg
      ownerRepo: next-docs
    - id: docs-site-structure
      paths:
        include:
          - package.json
          - .nvmrc
          - tsconfig.json
          - next.config.ts
          - edgeone.json
          - postcss.config.mjs
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - app/**
          - lib/**
          - components/**
          - crowdin.yml
          - context7.json
          - manifests/p0b/categories.json
          - manifests/p0b/site-routes.json
          - manifests/p0b/greenfield-deny.json
          - scripts/build.mjs
          - scripts/check-env.mjs
          - scripts/verify-out.mjs
          - scripts/check-links.mjs
          - scripts/check-screenshots.mjs
          - scripts/*.test.mjs
          - scripts/search-sync.mjs
      ownerRepo: next-docs

    - id: local-docpact-push-gate
      paths:
        include:
          - .githooks/**
          - scripts/docpact
          - scripts/docpact-gate.sh
          - scripts/install-git-hooks.sh
      ownerRepo: next-docs

coverage:
  include:
    - .githooks/**
    - scripts/docpact
    - scripts/docpact-gate.sh
    - scripts/install-git-hooks.sh
    - AGENTS.md
    - README.md
    - TODO.docs-system-gaps.md
    - .docpact/config.yaml
    - docs/agents/**
    - .github/dependabot.yml
    - context7.json
    - package.json
    - .nvmrc
    - tsconfig.json
    - .github/workflows/**
    - content/docs/**
    - public/assets/docs/**
    - public/favicon.ico
    - public/logo-light.svg
    - public/logo-dark.svg
    - scripts/build.mjs
    - scripts/check-env.mjs
    - scripts/verify-out.mjs
    - scripts/check-links.mjs
    - scripts/check-screenshots.mjs
    - scripts/*.test.mjs
    - scripts/search-sync.mjs
    - scripts/vendor/workspace-seo/**
    - .gitattributes
    - next.config.ts
    - edgeone.json
    - postcss.config.mjs
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - app/**
    - lib/**
    - components/**
    - crowdin.yml
    - manifests/p0b/categories.json
    - manifests/p0b/site-routes.json
    - manifests/p0b/greenfield-deny.json
  exclude:
    - .git/**
    - .github/scripts/**
    - .docpact/runs/**
    - node_modules/**
    - .next/**
    - out/**
    - .source/**

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    dependency-maintenance:
      paths:
        - .github/dependabot.yml
        - docs/agents/dependency-updates.md
        - pnpm-lock.yaml
    local-docpact-gate:
      paths:
        - .githooks/pre-push
        - scripts/docpact
        - scripts/docpact-gate.sh
        - scripts/install-git-hooks.sh
    public-content:
      paths:
        - content/docs/**
        - public/assets/docs/**
    site-structure:
      paths:
        - package.json
        - .nvmrc
        - tsconfig.json
        - next.config.ts
        - edgeone.json
        - postcss.config.mjs
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - app/**
        - lib/**
        - components/**
        - crowdin.yml
        - context7.json
        - scripts/build.mjs
        - scripts/check-env.mjs
        - scripts/verify-out.mjs
        - scripts/check-links.mjs
        - scripts/check-screenshots.mjs
        - scripts/*.test.mjs
        - scripts/search-sync.mjs
        - manifests/p0b/categories.json
        - manifests/p0b/site-routes.json
        - manifests/p0b/greenfield-deny.json
        - .github/workflows/publish-docs.yml
        - .github/workflows/reconcile-docs.yml
    drift-backlog:
      paths:
        - TODO.docs-system-gaps.md
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - .docpact/config.yaml
        - docs/agents/**
        - .github/workflows/**
    proof:
      paths:
        - docs/agents/repo-validation.md
        - package.json
        - next.config.ts
        - app/**
        - lib/**
        - components/**
    root-integration:
      paths:
        - AGENTS.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - TODO.docs-system-gaps.md
    - .docpact/config.yaml
    - docs/agents/repo-validation.md
    - docs/agents/repo-architecture.md
    - docs/agents/dependency-updates.md

repo:
  id: next-docs
  owner: next-docs

rules:
  - id: next-docs-dependency-monitoring-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: .github/dependabot.yml
        kind: dependency-monitoring-config
      - path: docs/agents/dependency-updates.md
        kind: dependency-maintainer-guide
    requiredDocs:
      - path: docs/agents/dependency-updates.md
        mode: review_or_update
    reason: Monitoring scope, cadence, compatibility grouping and existing PR validation must agree with the focused maintenance guide.
  - id: next-docs-dependency-lock-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: pnpm-lock.yaml
        kind: dependency-lock
    requiredDocs:
      - path: AGENTS.md
        mode: must_exist
      - path: docs/agents/dependency-updates.md
        mode: must_exist
    reason: Lock resolution maintenance retains dependency guidance without manufactured metadata edits; manifests, runtime, source, public content and publication retain separate review obligations.
  - id: next-docs-bootstrap-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/config.yaml
        kind: doc-ai-layer
      - path: docs/agents/repo-validation.md
        kind: deep-doc
      - path: docs/agents/repo-architecture.md
        kind: deep-doc
      - path: docs/agents/migration-cutover-runbook.md
        kind: retired-governance-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Repository guidance, machine-readable routing, and retained architecture/validation references must stay aligned.
  - id: next-docs-readme-and-backlog-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: README.md
        kind: repo-landing
      - path: TODO.docs-system-gaps.md
        kind: docs-backlog
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: TODO.docs-system-gaps.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Maintainer workflow and durable docs-drift backlog must stay aligned with the repo contract.
  - id: next-docs-public-content-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: content/docs/**
        kind: public-doc-source
      - path: public/assets/docs/**
        kind: public-asset
      - path: public/favicon.ico
        kind: public-asset
      - path: public/logo-light.svg
        kind: public-asset
      - path: public/logo-dark.svg
        kind: public-asset
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Public pages, mirrors, and assets define what this repo publishes and must keep ownership and proof expectations aligned.
  - id: next-docs-site-structure-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: package.json
        kind: site-runtime-config
      - path: .nvmrc
        kind: site-runtime-config
      - path: tsconfig.json
        kind: site-runtime-config
      - path: next.config.ts
        kind: site-config
      - path: edgeone.json
        kind: site-deploy-config
      - path: postcss.config.mjs
        kind: site-runtime-config
      - path: pnpm-workspace.yaml
        kind: site-runtime-config
      - path: app/**
        kind: site-runtime
      - path: lib/**
        kind: site-runtime
      - path: components/**
        kind: site-runtime
      - path: crowdin.yml
        kind: translation-config
      - path: manifests/p0b/categories.json
        kind: site-contract
      - path: manifests/p0b/site-routes.json
        kind: site-contract
      - path: manifests/p0b/greenfield-deny.json
        kind: site-contract
      - path: scripts/build.mjs
        kind: build-automation
      - path: scripts/check-env.mjs
        kind: build-automation
      - path: scripts/verify-out.mjs
        kind: build-automation
      - path: scripts/check-links.mjs
        kind: build-automation
      - path: scripts/check-screenshots.mjs
        kind: build-automation
      - path: scripts/*.test.mjs
        kind: build-automation-test
      - path: scripts/search-sync.mjs
        kind: publication-automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Navigation, site config, and runtime wiring change how future docs work should be routed and checked.
  - id: next-docs-doc-governance-ci
    scope: repo
    repo: next-docs
    triggers:
      - path: .github/workflows/ai-doc-lint.yml
        kind: automation
      - path: .github/workflows/publish-docs.yml
        kind: automation
      - path: .github/workflows/reconcile-docs.yml
        kind: automation
      - path: .github/workflows/build.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Documentation governance automation changes alter the maintenance gate and proof expectations.
  - id: next-docs-publication-pipeline
    scope: repo
    repo: next-docs
    triggers:
      - path: .github/workflows/publish-docs.yml
        kind: publication-automation
      - path: .github/workflows/reconcile-docs.yml
        kind: publication-automation
      - path: context7.json
        kind: ai-publication-config
      - path: app/llms.txt/route.ts
        kind: ai-publication-index
      - path: app/search-records.json/route.ts
        kind: ai-publication-index
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Publishing, deployed AI/search endpoints, and Context7 configuration define what public documentation is exposed after main merges.
  - id: next-docs-local-docpact-push-gate
    scope: repo
    repo: next-docs
    triggers:
      - path: .githooks/pre-push
        kind: local-git-hook
      - path: scripts/docpact
        kind: local-automation
      - path: scripts/docpact-gate.sh
        kind: local-automation
      - path: scripts/install-git-hooks.sh
        kind: local-automation
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Local push documentation governance gates must stay aligned with repo validation guidance and docpact configuration.
  - id: next-docs-shared-checker-snapshot
    scope: repo
    repo: next-docs
    triggers:
      - path: scripts/vendor/workspace-seo/**
        kind: generated-tooling-snapshot
      - path: .gitattributes
        kind: checkout-line-endings
    requiredDocs:
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: The shared checker snapshot is generated tooling owned by the private workspace source; its bytes are verified by digest and are never hand-edited, so any change to it or to the checkout rules that preserve those bytes must keep the documented export and provenance procedure accurate.
