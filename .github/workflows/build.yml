name: Build/release

# Version tag release gate. v4 §6.3: EdgeOne Makers Git integration is the
# only hosting publisher — this workflow performs validation only and never deploys.
on:
  push:
    tags:
      - 'v*'

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --force origin +refs/heads/main:refs/remotes/origin/main

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25

      - name: Install docpact
        run: cargo install docpact --version 0.1.9 --force

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Run docpact release gate
        run: |
          set -euo pipefail
          release_head="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          release_base="$(git rev-parse "${release_head}^")"
          scripts/docpact-gate.sh --base "$release_base" --head "$release_head"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint docs
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (ci fixture)
        env:
          DEPLOY_ENV: ci
          CANONICAL_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_SEARCH_MODE: static
          SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm build
