name: Publish docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: publish-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOCS_SITE_URL: https://docs.tiangong.earth

jobs:
  validate:
    name: Validate (required check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The workspace source repository is private, so this job consumes the generated snapshot
      # instead of fetching a private action or holding a token. Verify it before installing or
      # building: a snapshot that no longer matches its manifest must fail in seconds, not minutes.
      - name: Check the vendored shared SEO checker against its manifest
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, re, sys
          from pathlib import Path

          folder = Path('scripts/vendor/workspace-seo')
          manifest = json.loads((folder / 'manifest.json').read_text())
          expected = {
              'schema': 1,
              'generated': True,
              'source_repository': 'tiangong-lca/workspace',
              'source_path': 'scripts/seo/check.py',
          }
          problems = [f'{key}={manifest.get(key)!r} but expected {value!r}' for key, value in expected.items() if manifest.get(key) != value]
          if not re.fullmatch(r'[0-9a-f]{40}', str(manifest.get('source_commit', ''))):
              problems.append(f"source_commit={manifest.get('source_commit')!r} is not a full lowercase commit")
          digest = hashlib.sha256((folder / 'check.py').read_bytes()).hexdigest()
          if manifest.get('sha256') != digest:
              problems.append(f"check.py sha256={digest} but the manifest records {manifest.get('sha256')!r}")
          if problems:
              sys.exit('Vendored SEO checker snapshot does not match its manifest: ' + '; '.join(problems))
          print(f"local snapshot bytes match the manifest for {manifest['source_repository']}@{manifest['source_commit']} ({digest})")
          print('manifest identity is a local integrity statement only; origin provenance is attested by the workspace export against the private source commit')
          PYVERIFY

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint markdown
        run: pnpm lint

      - name: Typecheck (TypeScript 7 native)
        run: pnpm typecheck

      - name: Build (ci fixture) and verify out contract
        env:
          DEPLOY_ENV: ci
          CANONICAL_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_SEARCH_MODE: static
          BAIDU_SITE_VERIFICATION: ci-public-baidu-marker
          SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm build

      - name: Check published SEO output
        run: |
          python3 scripts/vendor/workspace-seo/check.py --root out --origin http://localhost:3000 --artifact-indexing disabled --output "seo-report.json"

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seo-report
          path: seo-report.json

  post-deploy-evidence:
    name: Post-deploy evidence (EdgeOne Makers owns build+deploy)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # EdgeOne Git integration owns build and deploy. This job records source
      # context while the reusable reconciliation job waits for the live SHA.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve publish context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pulls_file="$RUNNER_TEMP/commit-pulls.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            -H "Accept: application/vnd.github+json" > "$pulls_file" 2>/dev/null || printf '[]' > "$pulls_file"
          pull_urls="$(jq -r '.[].html_url' "$pulls_file" | paste -sd ', ' -)"
          echo "pull_urls=${pull_urls}" >> "$GITHUB_OUTPUT"

          node - "$pulls_file" <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');

          const pulls = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const markers = [
            'docs-impact-local-apply-mapped:v1',
            'docs-impact-local-replay-mapped:v1',
          ];

          function escapeRegExp(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          }

          function hiddenJson(marker, body) {
            const pattern = new RegExp(`<!--\\s*${escapeRegExp(marker)}\\s*(\\{[\\s\\S]*?\\})\\s*-->`);
            const match = String(body || '').match(pattern);
            if (!match) return null;
            try {
              return JSON.parse(match[1]);
            } catch (error) {
              console.error(`Ignoring malformed ${marker} metadata: ${error.message}`);
              return null;
            }
          }

          let metadata = null;

          for (const pull of pulls) {
            for (const marker of markers) {
              const parsed = hiddenJson(marker, pull.body);
              if (parsed?.docsImpactIssue) {
                metadata = parsed;
                break;
              }
            }
            if (metadata) break;
          }

          const rawIssueRef = typeof metadata?.docsImpactIssue === 'string' ? metadata.docsImpactIssue : '';
          const match = rawIssueRef.match(/^([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)#([1-9][0-9]*)$/);
          const issueRef = match ? `${match[1]}#${match[2]}` : '';

          console.log(`docs_impact_issue=${issueRef}`);
          console.log(`docs_impact_issue_repo=${match ? match[1] : ''}`);
          console.log(`docs_impact_issue_number=${match ? match[2] : ''}`);
          NODE

      - name: Write publish summary
        if: always()
        env:
          PULL_URLS: ${{ steps.context.outputs.pull_urls }}
          DOCS_IMPACT_ISSUE: ${{ steps.context.outputs.docs_impact_issue }}
        run: |
          {
            echo "## Docs publish (EdgeOne Makers)"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Build & deploy: EdgeOne Makers Git integration (this workflow does not deploy)"
            echo "- Site: ${DOCS_SITE_URL} (EdgeOne production)"
            echo "- Reconciliation: automatic live-SHA validation, Algolia sync, and Context7 refresh"
            echo "- Source PRs: ${PULL_URLS:-not found}"
            echo "- Docs impact issue: ${DOCS_IMPACT_ISSUE:-not found}"
          } >> "$GITHUB_STEP_SUMMARY"

  reconcile-production:
    name: Reconcile deployed docs
    if: github.event_name == 'push'
    needs: post-deploy-evidence
    uses: ./.github/workflows/reconcile-docs.yml
    with:
      verify_origin: https://docs.tiangong.earth
      expected_sha: ${{ github.sha }}
    secrets: inherit
